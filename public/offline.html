<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Offline · Strumfolio</title>
    <!--
      The page the service worker shows when a navigation misses every cache with no network
      (`sw.ts`, `fallbacks`). Static and self-contained on purpose: it is precached at install,
      and every precached URL must answer `200` to a stranger with no redirect or the install
      fails for everybody (root CLAUDE.md, «Every precached URL must be fetchable by a
      stranger»). So no session, no React, no stylesheet to fetch — the colours are
      DESIGN.md's tokens written out, and the theme is the device's own `songs:theme`.
    -->
    <style>
      :root {
        --bg: #f6f5f2;
        --surface: #ffffff;
        --ink: #16181d;
        --muted: #5c626c;
        --line: #dcdad4;
        --accent: #97490f;
        --on-accent: #fffaf4;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #101216;
          --surface: #181b21;
          --ink: #eceef1;
          --muted: #99a0aa;
          --line: #2b2f37;
          --accent: #f0b268;
          --on-accent: #1b1206;
          color-scheme: dark;
        }
      }
      :root[data-theme='dark'] {
        --bg: #101216;
        --surface: #181b21;
        --ink: #eceef1;
        --muted: #99a0aa;
        --line: #2b2f37;
        --accent: #f0b268;
        --on-accent: #1b1206;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--ink);
        font-family: Outfit, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        width: 100%;
        max-width: 26rem;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 22px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.5;
        font-size: 0.95rem;
      }
      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      a,
      button {
        font: inherit;
        font-size: 0.95rem;
        border-radius: 999px;
        min-height: 44px;
        padding: 0 18px;
        display: inline-flex;
        align-items: center;
        text-decoration: none;
        cursor: pointer;
      }
      .primary {
        background: var(--accent);
        color: var(--on-accent);
        border: 1px solid var(--accent);
      }
      .quiet {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
      }
    </style>
    <script>
      try {
        var theme = localStorage.getItem('songs:theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (error) {}
    </script>
  </head>
  <body>
    <main>
      <h1>You&rsquo;re offline</h1>
      <p>
        This page isn&rsquo;t saved on this device yet. Your songbooks and songs are kept here once
        the app has been opened with a signal, so they still open — this one will too, next time
        you are online.
      </p>
      <div class="actions">
        <a class="primary" href="/">Your songbooks</a>
        <button class="quiet" type="button" onclick="history.back()">Go back</button>
      </div>
    </main>
  </body>
</html>
